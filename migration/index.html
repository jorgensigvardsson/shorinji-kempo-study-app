<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://app.shorinjikempo.net/">
<title>Appen har flyttat — Shorinji Kempo</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1f23;
    --muted: #5c636a;
    --border: #dee2e6;
    --accent: #0d6efd;
    --accent-text: #ffffff;
    --note-bg: #fff8e6;
    --note-border: #ffe08a;
    --ok-bg: #e7f5ec;
    --ok-border: #a7d7ba;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191d;
      --card: #1f2429;
      --text: #e8eaed;
      --muted: #a3abb2;
      --border: #333a41;
      --accent: #4d94ff;
      --accent-text: #0b0f14;
      --note-bg: #2c2718;
      --note-border: #5c4f22;
      --ok-bg: #17281d;
      --ok-border: #2f5c3f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 40rem; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.75rem;
    margin-bottom: 1.25rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  h2 { font-size: 1.1rem; margin: 0 0 0.5rem; }
  p { margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    text-decoration: none;
    font-weight: 600;
    padding: 0.7rem 1.4rem;
    border-radius: 0.5rem;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { filter: brightness(1.08); }
  .url { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
  .note { background: var(--note-bg); border: 1px solid var(--note-border); }
  .ok { background: var(--ok-bg); border: 1px solid var(--ok-border); }
  .hidden { display: none; }
  .langs { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; }
  .langs button {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 0 0.4rem; font-size: inherit; font-family: inherit;
    text-decoration: underline;
  }
  .langs button[aria-current="true"] { color: var(--text); font-weight: 600; text-decoration: none; }
  ol { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin-bottom: 0.5rem; }
  h3 { font-size: 1rem; margin: 1.5rem 0 0.6rem; }
  .done {
    background: var(--ok-bg);
    border: 1px solid var(--ok-border);
    border-radius: 0.5rem;
    padding: 0.7rem 1rem;
  }
  .warn {
    border-left: 3px solid var(--accent);
    padding-left: 0.85rem;
    margin-bottom: 0;
    font-size: 0.95rem;
  }
  .ui { font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1 id="h-title">Appen har flyttat</h1>
    <p id="t-intro"></p>
    <p><a class="btn" id="t-cta" href="https://app.shorinjikempo.net/">Gå till appen</a></p>
    <p class="muted"><span id="t-newaddr"></span> <span class="url">app.shorinjikempo.net</span></p>
  </div>

  <!-- Shown when the user is signed in to an account: nothing to rescue. -->
  <div class="card ok hidden" id="box-account">
    <h2 id="t-acc-h"></h2>
    <p id="t-acc-b"></p>
  </div>

  <!-- Shown when there is local data and no account. -->
  <div class="card note hidden" id="box-export">
    <h2 id="t-exp-h"></h2>
    <p id="t-exp-b"></p>
    <p class="muted hidden" id="t-drive"></p>
    <p class="muted" id="t-summary"></p>
    <p><button class="btn" id="btn-export"></button></p>

    <p class="done hidden" id="box-done"><strong id="t-done-b"></strong></p>

    <h3 id="t-steps-h"></h3>
    <ol>
      <li id="t-step1"></li>
      <li id="t-step2"></li>
      <li id="t-step3"></li>
      <li id="t-step4"></li>
      <li id="t-step5"></li>
    </ol>
    <p class="warn" id="t-warn"></p>
  </div>

  <div class="langs">
    <button data-lang="sv">Svenska</button>
    <button data-lang="en">English</button>
    <button data-lang="tr">Türkçe</button>
    <button data-lang="ja">日本語</button>
  </div>

</div>

<script>
(function () {
  "use strict";

  // Storage keys, mirrored from the app:
  //   app-data-document          persistence/store.ts   (the whole document)
  //   sync-backend-connected     sync/backend.ts        (signed in to an account)
  //   sync-backend-auth-expired  sync/backend.ts        (session no longer valid)
  var DOC_KEY = "app-data-document";
  var CONNECTED_KEY = "sync-backend-connected";
  var EXPIRED_KEY = "sync-backend-auth-expired";
  var USER_KEY = "sync-backend-user";

  var STRINGS = {
    sv: {
      title: "Appen har flyttat",
      intro: "Shorinji Kempo-appen finns nu på en ny adress. Den här sidan uppdateras inte längre.",
      cta: "Gå till appen",
      newaddr: "Ny adress:",
      accH: "Du har ett konto",
      accB: "Logga in på den nya adressen, så finns allt ditt material kvar.",
      expH: "Du har data på den här sidan",
      expHAccount: "Saknas något?",
      expB: "Ditt material finns bara här, på den här enheten. Ladda ner det och ta med det till den nya adressen.",
      expBAccount: "Om din data inte ser rätt ut på den nya sidan kan du ladda ner den härifrån och importera den där.",
      drive: "Ditt material kan också finnas i molntjänsten du anslutit. Den kan du ansluta på nytt på den nya sidan.",
      exportBtn: "Ladda ner data",
      doneB: "Filen har laddats ner — fortsätt med steg 2.",
      stepsH: "Så här flyttar du din data",
      step1: "Klicka på ”Ladda ner data” ovan. Filen laddas ner till din enhet.",
      step2: "Öppna app.shorinjikempo.net i webbläsaren.",
      step3: "Tryck på ”Mer” i menyn och välj ”Inställningar”.",
      step4: "Skrolla ner till ”Exportera/importera data”.",
      step5: "Klicka på ”Importera” och välj filen du laddade ner i steg 1.",
      warn: "Importera innan du loggar in. Efter inloggning visas inte importvalet.",
      sumNotes: "anteckningar",
      sumRanks: "markerade tekniker",
      sumCards: "flashcards",
      sumEmpty: "Innehåller dina inställningar.",
      sumPrefix: "Innehåller:"
    },
    en: {
      title: "The app has moved",
      intro: "The Shorinji Kempo app now lives at a new address. This page is no longer updated.",
      cta: "Go to the app",
      newaddr: "New address:",
      accH: "You have an account",
      accB: "Sign in at the new address and all your material will be there.",
      expH: "You have data on this site",
      expHAccount: "Something missing?",
      expB: "Your material is only here, on this device. Download it and take it with you to the new address.",
      expBAccount: "If your data doesn't look right on the new site, you can download it here and import it there.",
      drive: "Your material may also be in the cloud service you connected. You can reconnect it on the new site.",
      exportBtn: "Download data",
      doneB: "File downloaded — continue with step 2.",
      stepsH: "How to move your data",
      step1: "Click “Download data” above. The file downloads to your device.",
      step2: "Open app.shorinjikempo.net in your browser.",
      step3: "Tap “More” in the menu and choose “Settings”.",
      step4: "Scroll down to “Export/import data”.",
      step5: "Click “Import” and pick the file you downloaded in step 1.",
      warn: "Import before you sign in. After signing in, the import option is no longer shown.",
      sumNotes: "notes",
      sumRanks: "marked techniques",
      sumCards: "flash cards",
      sumEmpty: "Contains your settings.",
      sumPrefix: "Contains:"
    },
    tr: {
      title: "Uygulama taşındı",
      intro: "Shorinji Kempo uygulaması artık yeni bir adreste. Bu sayfa artık güncellenmiyor.",
      cta: "Uygulamaya git",
      newaddr: "Yeni adres:",
      accH: "Bir hesabınız var",
      accB: "Yeni adreste giriş yapın, tüm materyaliniz orada olacak.",
      expH: "Bu sitede verileriniz var",
      expHAccount: "Eksik bir şey mi var?",
      expB: "Materyaliniz yalnızca burada, bu cihazda. İndirin ve yeni adrese götürün.",
      expBAccount: "Verileriniz yeni sitede doğru görünmüyorsa, buradan indirip orada içe aktarabilirsiniz.",
      drive: "Materyaliniz bağladığınız bulut hizmetinde de bulunabilir. Yeni sitede yeniden bağlayabilirsiniz.",
      exportBtn: "Verileri indir",
      doneB: "Dosya indirildi — 2. adımla devam edin.",
      stepsH: "Verilerinizi nasıl taşırsınız",
      step1: "Yukarıdaki “Verileri indir” düğmesine tıklayın. Dosya cihazınıza indirilir.",
      step2: "Tarayıcınızda app.shorinjikempo.net adresini açın.",
      step3: "Menüden “Daha fazla” ögesine dokunun ve “Ayarlar” seçeneğini seçin.",
      step4: "“Veriyi dışa/içe aktar” bölümüne kadar aşağı kaydırın.",
      step5: "“İçe aktar” seçeneğine tıklayın ve 1. adımda indirdiğiniz dosyayı seçin.",
      warn: "Giriş yapmadan önce içe aktarın. Giriş yaptıktan sonra içe aktarma seçeneği görünmez.",
      sumNotes: "not",
      sumRanks: "işaretlenmiş teknik",
      sumCards: "bilgi kartı",
      sumEmpty: "Ayarlarınızı içerir.",
      sumPrefix: "İçerik:"
    },
    ja: {
      title: "アプリは移転しました",
      intro: "少林寺拳法アプリは新しいアドレスに移転しました。このページはもう更新されません。",
      cta: "アプリへ移動",
      newaddr: "新しいアドレス:",
      accH: "アカウントがあります",
      accB: "新しいアドレスでログインすれば、データはすべてそのまま残っています。",
      expH: "このサイトにデータがあります",
      expHAccount: "内容が足りませんか？",
      expB: "データはこの端末だけに保存されています。ダウンロードして、新しいアドレスへ持っていってください。",
      expBAccount: "新しいサイトでデータが正しく表示されない場合は、ここからダウンロードして、新しいサイトでインポートできます。",
      drive: "接続済みのクラウドサービスにもデータがある可能性があります。新しいサイトで再接続できます。",
      exportBtn: "データをダウンロード",
      doneB: "ファイルをダウンロードしました。手順2に進んでください。",
      stepsH: "データの移行手順",
      step1: "上の「データをダウンロード」をクリックします。ファイルが端末にダウンロードされます。",
      step2: "ブラウザで app.shorinjikempo.net を開きます。",
      step3: "メニューの「その他」から「設定」を選びます。",
      step4: "「データのエクスポート/インポート」まで下にスクロールします。",
      step5: "「インポート」をクリックし、手順1でダウンロードしたファイルを選びます。",
      warn: "ログインする前にインポートしてください。ログイン後はインポートの項目は表示されません。",
      sumNotes: "件のメモ",
      sumRanks: "件の技の記録",
      sumCards: "枚のフラッシュカード",
      sumEmpty: "設定が含まれます。",
      sumPrefix: "内容:"
    }
  };

  function readDocument() {
    try {
      var raw = localStorage.getItem(DOC_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function readFlag(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  // Whether this person has an account on the backend.
  //
  // sync-backend-connected alone is NOT reliable here. completeAuthorizationIfPresent()
  // in sync/backend.ts removes that key on EVERY failure path, including a caught
  // network error — so once the backend moved to its new hostnames, the old app's
  // own failing /auth/me calls wiped the flag from devices that were signed in.
  //
  // sync-backend-user survives that path: it is only removed by an explicit
  // disconnect or account deletion. syncProvider is a third, weaker corroboration.
  function hasAccount(doc) {
    if (readFlag(CONNECTED_KEY) === "true" && readFlag(EXPIRED_KEY) !== "true") {
      return true;
    }
    var raw = readFlag(USER_KEY);
    if (raw) {
      try {
        if (JSON.parse(raw).email) return true;
      } catch (e) {
        // Unparseable cache — fall through to the syncProvider check.
      }
    }
    return !!(doc && doc.data && doc.data.syncProvider === "backend");
  }

  function countKeys(value) {
    return value && typeof value === "object" && !Array.isArray(value)
      ? Object.keys(value).length
      : 0;
  }

  // Defaults alone are not "data" — only things the user actually produced.
  function hasUserData(doc) {
    var d = doc && doc.data;
    if (!d) return false;
    return countKeys(d.notes) > 0
      || countKeys(d.hokeiRanks) > 0
      || countKeys(d.knownFlashCards) > 0
      || (typeof d.quizStreakHighScore === "number" && d.quizStreakHighScore > 0)
      || (typeof d.kenshiNumber === "string" && d.kenshiNumber.length > 0)
      || (d.currentWeekAnchor && typeof d.currentWeekAnchor === "object");
    }

  function pickLanguage(doc) {
    var stored = doc && doc.data && doc.data.language;
    if (stored && STRINGS[stored]) return stored;
    var nav = (navigator.language || "sv").slice(0, 2).toLowerCase();
    return STRINGS[nav] ? nav : "sv";
  }

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function show(id, visible) {
    var el = document.getElementById(id);
    if (el) el.classList.toggle("hidden", !visible);
  }

  var doc = readDocument();
  var account = hasAccount(doc);
  var hasData = hasUserData(doc);
  var provider = doc && doc.data && doc.data.syncProvider;

  function summarise(s) {
    var d = (doc && doc.data) || {};
    var parts = [];
    var notes = countKeys(d.notes);
    var ranks = countKeys(d.hokeiRanks);
    var cards = countKeys(d.knownFlashCards);
    if (notes) parts.push(notes + " " + s.sumNotes);
    if (ranks) parts.push(ranks + " " + s.sumRanks);
    if (cards) parts.push(cards + " " + s.sumCards);
    return parts.length ? s.sumPrefix + " " + parts.join(", ") : s.sumEmpty;
  }

  function render(lang) {
    var s = STRINGS[lang] || STRINGS.sv;
    document.documentElement.lang = lang;
    document.title = s.title + " — Shorinji Kempo";

    setText("h-title", s.title);
    setText("t-intro", s.intro);
    setText("t-cta", s.cta);
    setText("t-newaddr", s.newaddr);
    setText("t-acc-h", s.accH);
    setText("t-acc-b", s.accB);
    setText("t-exp-h", s.expH);
    setText("t-exp-b", s.expB);
    setText("t-drive", s.drive);
    setText("btn-export", s.exportBtn);
    setText("t-done-b", s.doneB);
    setText("t-steps-h", s.stepsH);
    setText("t-step1", s.step1);
    setText("t-step2", s.step2);
    setText("t-step3", s.step3);
    setText("t-step4", s.step4);
    setText("t-step5", s.step5);
    setText("t-warn", s.warn);
    setText("t-summary", summarise(s));

    // Account holders see the same section, but framed as an optional backup
    // rather than "you have data here" — which reads as a warning when you know
    // your material is already safely synced.
    setText("t-exp-h", account ? s.expHAccount : s.expH);
    setText("t-exp-b", account ? s.expBAccount : s.expB);
    show("box-account", account);
    show("box-export", hasData);
    show("t-drive", !account && hasData && (provider === "onedrive" || provider === "google-drive"));

    var buttons = document.querySelectorAll(".langs button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-current", String(buttons[i].getAttribute("data-lang") === lang));
    }
  }

  // Produces exactly what the app's importer expects: { version, data }.
  // See importData() in src/Settings.tsx — it reads parsed.version and parsed.data.
  function exportData() {
    if (!doc) return;
    var payload = {
      version: typeof doc.version === "number" ? doc.version : 1,
      data: doc.data
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "shorinji-kempo-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Delay revocation: revoking immediately can cancel the download in some browsers.
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    show("box-done", true);
  }

  document.getElementById("btn-export").addEventListener("click", exportData);

  var langButtons = document.querySelectorAll(".langs button");
  for (var i = 0; i < langButtons.length; i++) {
    langButtons[i].addEventListener("click", function () {
      render(this.getAttribute("data-lang"));
    });
  }

  render(pickLanguage(doc));
})();
</script>
</body>
</html>
