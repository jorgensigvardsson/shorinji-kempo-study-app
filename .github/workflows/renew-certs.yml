name: Renew-Certs
#
# Issues/renews TLS certificates for both environments' backend custom domains
# via Let's Encrypt (DNS-01, using DirectAdmin's API through
# certbot-dns-directadmin) and uploads them as bring-your-own certificates on
# each Container Apps environment. Originally added for staging, whose
# managed-certificate issuance repeatedly failed with a generic "Operation
# timed out." error; prod's managed certs work fine today, but was switched
# over too for consistency between the two pipelines — see BACKEND.md.
#
# Runs on a schedule rather than being triggered by a deploy, so it must be
# merged to main to actually fire: GitHub always evaluates a workflow's
# `schedule:` trigger using the copy of this file on the repo's default
# branch, regardless of which branch is "current" for either environment
# otherwise.
#
# ── Failure handling ──────────────────────────────────────────────────────────
# The job runs *daily* and does nothing on most days: it first asks each
# hostname what certificate it is actually serving, and only issues a new one
# when fewer than RENEW_BEFORE_DAYS (default 30) days remain — or when the
# handshake fails outright, which is the "TLS is already broken, fix it"
# signal. This is what makes the job self-healing: a failed attempt is simply
# retried tomorrow, and every day after, until it succeeds or the certificate
# expires. It replaces a bimonthly cron under which a single failed run meant
# no second attempt before expiry.
#
# Every failed attempt also emails CERT_ALERT_EMAIL (falling back to
# ACME_CONTACT_EMAIL) with the days remaining, so nobody has to be watching the
# Actions tab. GitHub's own notification for a failed scheduled run only
# reaches whoever last touched the cron line, and is easy to miss.
#
# One-time bootstrap per environment: run this manually (workflow_dispatch)
# once before relying on deploy-staging.yml/deploy.yml's hostname bind steps,
# which bind against the certificate this workflow uploads and will fail if
# it doesn't exist yet.

on:
  schedule:
    # Daily. The work is skipped unless a certificate is close to expiry, so
    # this costs one TLS handshake per hostname on an ordinary day; what it
    # buys is ~30 consecutive chances to renew before anything breaks. The
    # cadence needs no revisiting if Let's Encrypt's phased move to 45-day
    # certificates reaches this account — a 30-day threshold still leaves a
    # fortnight of retries.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Renew even if the current certificates are not near expiry'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  # Renew once the served certificate has fewer than this many days left.
  RENEW_BEFORE_DAYS: 30

jobs:
  renew:
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set environment-specific values
        run: |
          set -euo pipefail
          case "${{ matrix.environment }}" in
            staging)
              echo "RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP_STAGING }}"     >> "$GITHUB_ENV"
              echo "ENV_NAME=sk-study-app-staging-env"                          >> "$GITHUB_ENV"
              echo "AUTH_APP=sk-study-app-staging-auth"                         >> "$GITHUB_ENV"
              echo "PERSISTENCE_APP=sk-study-app-staging-persistence"           >> "$GITHUB_ENV"
              echo "CERT_NAME=sk-study-app-staging-cert"                        >> "$GITHUB_ENV"
              echo "CERT_DIR_NAME=sk-study-app-staging"                         >> "$GITHUB_ENV"
              echo "AUTH_HOSTNAME=auth.app-staging.shorinjikempo.net"           >> "$GITHUB_ENV"
              echo "PERSISTENCE_HOSTNAME=persistence.app-staging.shorinjikempo.net" >> "$GITHUB_ENV"
              ;;
            prod)
              echo "RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}"            >> "$GITHUB_ENV"
              echo "ENV_NAME=sk-study-app-env"                                  >> "$GITHUB_ENV"
              echo "AUTH_APP=sk-study-app-auth"                                 >> "$GITHUB_ENV"
              echo "PERSISTENCE_APP=sk-study-app-persistence"                   >> "$GITHUB_ENV"
              echo "CERT_NAME=sk-study-app-cert"                                >> "$GITHUB_ENV"
              echo "CERT_DIR_NAME=sk-study-app"                                 >> "$GITHUB_ENV"
              echo "AUTH_HOSTNAME=auth.app.shorinjikempo.net"                   >> "$GITHUB_ENV"
              echo "PERSISTENCE_HOSTNAME=persistence.app.shorinjikempo.net"     >> "$GITHUB_ENV"
              ;;
          esac

      - name: Check that failure alerting is configured
        env:
          SMTP_HOST:  ${{ vars.SMTP_HOST }}
          SMTP_FROM:  ${{ vars.SMTP_FROM }}
          ALERT_TO:   ${{ vars.CERT_ALERT_EMAIL || vars.ACME_CONTACT_EMAIL }}
        run: |
          set -uo pipefail
          # Checked on every run, not just failing ones: an alert path that is
          # only exercised when something breaks is an alert path nobody knows
          # is broken.
          missing=""
          for name in SMTP_HOST SMTP_FROM ALERT_TO; do
            [ -n "${!name}" ] || missing="${missing}${missing:+, }${name}"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Certificate renewal failures cannot be emailed — unset: ${missing}. See BACKEND.md."
          else
            echo "Failure alerts will go to ${ALERT_TO}."
          fi

      - name: Check how long the served certificates are still valid
        run: |
          set -uo pipefail
          min=""
          summary=""
          for host in "$AUTH_HOSTNAME" "$PERSISTENCE_HOSTNAME"; do
            days="$(.github/scripts/cert-days-left.sh "$host")"
            echo "$host: $days day(s) of validity left"
            summary="${summary}${summary:+; }${host}: ${days}"
            # An unreachable host or unparseable date sorts below every real
            # answer, so it always triggers a renewal attempt.
            if [ "$days" = unknown ]; then days=-1; fi
            if [ -z "$min" ] || [ "$days" -lt "$min" ]; then min="$days"; fi
          done

          echo "CERT_DAYS_LEFT=$min"        >> "$GITHUB_ENV"
          echo "CERT_DAYS_SUMMARY=$summary" >> "$GITHUB_ENV"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced by workflow_dispatch input."
            needed=true
          elif [ "$min" -lt "$RENEW_BEFORE_DAYS" ]; then
            echo "Fewer than $RENEW_BEFORE_DAYS days left — renewing."
            needed=true
          else
            echo "More than $RENEW_BEFORE_DAYS days left — nothing to do today."
            needed=false
          fi
          echo "RENEW_NEEDED=$needed" >> "$GITHUB_ENV"

          {
            echo "### ${{ matrix.environment }}"
            echo ""
            echo "- Validity remaining: ${summary}"
            echo "- Renewing: ${needed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install certbot + DirectAdmin DNS plugin
        if: env.RENEW_NEEDED == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/certbot-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/certbot-venv/bin/activate"
          pip install --quiet certbot certbot-dns-directadmin
          echo "$RUNNER_TEMP/certbot-venv/bin" >> "$GITHUB_PATH"

      - name: Write DirectAdmin API credentials
        if: env.RENEW_NEEDED == 'true'
        env:
          DIRECTADMIN_SERVER:    ${{ vars.DIRECTADMIN_SERVER }}
          DIRECTADMIN_USERNAME:  ${{ vars.DIRECTADMIN_USERNAME }}
          DIRECTADMIN_LOGIN_KEY: ${{ secrets.DIRECTADMIN_LOGIN_KEY }}
        run: |
          set -euo pipefail
          for name in DIRECTADMIN_SERVER DIRECTADMIN_USERNAME DIRECTADMIN_LOGIN_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is not set — see BACKEND.md"; exit 1; }
          done
          cat > "$RUNNER_TEMP/directadmin.ini" <<EOF
          dns_directadmin_url = ${DIRECTADMIN_SERVER}
          dns_directadmin_username = ${DIRECTADMIN_USERNAME}
          dns_directadmin_password = ${DIRECTADMIN_LOGIN_KEY}
          EOF
          chmod 600 "$RUNNER_TEMP/directadmin.ini"

      - name: Request certificate (DNS-01 via DirectAdmin)
        if: env.RENEW_NEEDED == 'true'
        env:
          ACME_CONTACT_EMAIL: ${{ vars.ACME_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          [ -n "$ACME_CONTACT_EMAIL" ] || { echo "::error::ACME_CONTACT_EMAIL is not set — see BACKEND.md"; exit 1; }
          certbot certonly \
            --non-interactive --agree-tos -m "$ACME_CONTACT_EMAIL" \
            --authenticator dns-directadmin \
            --dns-directadmin-credentials "$RUNNER_TEMP/directadmin.ini" \
            --dns-directadmin-propagation-seconds 60 \
            --config-dir "$RUNNER_TEMP/le-config" \
            --work-dir   "$RUNNER_TEMP/le-work" \
            --logs-dir   "$RUNNER_TEMP/le-logs" \
            --cert-name "$CERT_DIR_NAME" \
            -d "$AUTH_HOSTNAME" \
            -d "$PERSISTENCE_HOSTNAME"

      - name: Package as PFX
        if: env.RENEW_NEEDED == 'true'
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/le-config/live/$CERT_DIR_NAME"
          PFX_PASSWORD="$(openssl rand -base64 24)"
          openssl pkcs12 -export \
            -in "$live/fullchain.pem" \
            -inkey "$live/privkey.pem" \
            -passout "pass:${PFX_PASSWORD}" \
            -out "$RUNNER_TEMP/cert.pfx"
          # Masked so it never appears in logs, and available to later steps.
          echo "::add-mask::$PFX_PASSWORD"
          echo "PFX_PASSWORD=$PFX_PASSWORD" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        if: env.RENEW_NEEDED == 'true'
        uses: azure/login@v3
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload certificate to the Container Apps environment
        if: env.RENEW_NEEDED == 'true'
        run: |
          set -euo pipefail
          az containerapp env certificate upload \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ENV_NAME" \
            --certificate-file "$RUNNER_TEMP/cert.pfx" \
            --password "$PFX_PASSWORD" \
            --certificate-name "$CERT_NAME"

      - name: Bind hostnames to the uploaded certificate
        if: env.RENEW_NEEDED == 'true'
        run: |
          set -uo pipefail

          # ACA serialises modifications to a container app; a bind can transiently
          # fail with CustomDomainLockConflict if another change is mid-flight.
          retry_on_lock() {
            local n=0 max=12 delay=20 out rc
            while :; do
              out="$("$@" 2>&1)"; rc=$?
              if [ "$rc" -eq 0 ]; then
                [ -n "$out" ] && printf '%s\n' "$out"
                return 0
              fi
              if printf '%s' "$out" | grep -qiE 'CustomDomainLockConflict|another modification is in progress'; then
                n=$((n + 1))
                if [ "$n" -ge "$max" ]; then
                  printf '%s\n' "$out"
                  echo "::error::Custom domain still locked after $max attempts"
                  return "$rc"
                fi
                echo "Custom domain locked; retry $n/$max in ${delay}s..."
                sleep "$delay"
                continue
              fi
              printf '%s\n' "$out"
              return "$rc"
            done
          }

          retry_on_lock az containerapp hostname add \
            --hostname "$AUTH_HOSTNAME" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AUTH_APP" || true
          retry_on_lock az containerapp hostname bind \
            --hostname "$AUTH_HOSTNAME" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AUTH_APP" \
            --environment "$ENV_NAME" \
            --certificate "$CERT_NAME" || exit 1

          retry_on_lock az containerapp hostname add \
            --hostname "$PERSISTENCE_HOSTNAME" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PERSISTENCE_APP" || true
          retry_on_lock az containerapp hostname bind \
            --hostname "$PERSISTENCE_HOSTNAME" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PERSISTENCE_APP" \
            --environment "$ENV_NAME" \
            --certificate "$CERT_NAME" || exit 1

      - name: Verify the new certificate is the one being served
        if: env.RENEW_NEEDED == 'true'
        run: |
          set -uo pipefail

          # Two things have to be true afterwards, and only the second one was
          # ever checked: the hostname answers, *and* it answers with the
          # certificate that was just issued. A bind that silently kept serving
          # the old certificate would otherwise leave a green run behind and
          # expire anyway. The binding can take a little while to propagate, so
          # give it a few rounds before calling it a failure.
          for attempt in $(seq 1 10); do
            fail=0
            for host in "$AUTH_HOSTNAME" "$PERSISTENCE_HOSTNAME"; do
              days="$(.github/scripts/cert-days-left.sh "$host")"
              echo "attempt $attempt — $host: $days day(s) left"
              if [ "$days" = unknown ] || [ "$days" -lt "$RENEW_BEFORE_DAYS" ]; then
                fail=1
              fi
            done
            if [ "$fail" -eq 0 ]; then
              echo "Both hostnames are serving the renewed certificate."
              exit 0
            fi
            # `test && sleep` would abort the whole step under errexit on the
            # last round, when the test is false — hence the explicit `if`.
            if [ "$attempt" -lt 10 ]; then sleep 30; fi
          done

          echo "::error::After binding, at least one hostname is unreachable or still serving a certificate that expires within $RENEW_BEFORE_DAYS days."
          exit 1

      - name: Check that the services answer over the new certificate
        if: env.RENEW_NEEDED == 'true'
        run: |
          set -uo pipefail
          fail=0
          check() {
            local url="$1" code
            # GitHub Actions runs `run:` blocks under `bash -e`; a bare
            # `test && action` returns the test's own (falsy) status on the
            # healthy path and aborts the script right there. `code=$(...) ||
            # code=000` and an `if` (exempt from errexit on its condition)
            # avoid that.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url") || code=000
            echo "$url -> HTTP $code"
            if [ "$code" = "000" ]; then
              fail=1
            fi
          }
          check "https://${AUTH_HOSTNAME}/.well-known/jwks.json"
          check "https://${PERSISTENCE_HOSTNAME}/api/v1/document"
          if [ "$fail" -ne 0 ]; then
            echo "::error::TLS handshake or connection failed on at least one hostname after binding."
            exit 1
          fi

      - name: Email the failure
        if: failure()
        env:
          SMTP_HOST:     ${{ vars.SMTP_HOST }}
          SMTP_PORT:     ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:     ${{ vars.SMTP_FROM }}
          SMTP_TLS:      ${{ vars.SMTP_TLS || 'starttls' }}
          ALERT_TO:      ${{ vars.CERT_ALERT_EMAIL || vars.ACME_CONTACT_EMAIL }}
        run: |
          set -uo pipefail
          days="${CERT_DAYS_LEFT:-unknown}"
          summary="${CERT_DAYS_SUMMARY:-not measured — the run failed before probing}"

          # Below a fortnight there is no longer room for this to sort itself
          # out by tomorrow, so the subject line stops being polite about it.
          if [ "$days" = unknown ]; then
            urgency="[ACTION NEEDED]"; state="remaining validity not yet measured"
          elif [ "$days" -lt 0 ]; then
            urgency="[URGENT]";        state="HTTPS is already not answering"
          elif [ "$days" -lt 14 ]; then
            urgency="[URGENT]";        state="${days} days left"
          else
            urgency="[warning]";       state="${days} days left"
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          export ALERT_SUBJECT="${urgency} Certificate renewal failed for ${{ matrix.environment }} — ${state}"

          # A heredoc rather than a multi-line string: YAML strips exactly this
          # block's indentation, so lines written at this column arrive in the
          # mail body unindented.
          ALERT_BODY="$(cat <<EOF
          The scheduled TLS certificate renewal for the ${{ matrix.environment }} backend failed.

          Validity remaining per hostname: ${summary}
          Failed run: ${run_url}

          The job retries automatically every day at 03:17 UTC and keeps emailing
          until it succeeds, so no manual re-run is required — but the certificate
          expires on its own schedule, and once it does both backend hostnames stop
          answering over HTTPS.

          If the cause is DirectAdmin, Let's Encrypt or Azure being briefly
          unavailable, tomorrow's run will likely fix it by itself. Anything else —
          an expired DirectAdmin login key, a deleted Azure federated credential,
          changed DNS — needs a human. See BACKEND.md for the renewal pipeline and
          its prerequisites.
          EOF
          )"
          export ALERT_BODY

          python3 .github/scripts/send-alert-email.py
