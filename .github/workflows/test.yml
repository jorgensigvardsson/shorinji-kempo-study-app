name: Test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            backend/auth/go.sum
            backend/persistence/go.sum
            backend/go.work.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Go tests
        run: gotestsum --junitfile test-results.xml ./auth/... ./persistence/... ./shared/...
        working-directory: backend
        continue-on-error: true
        id: run-go-tests

      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Go
          path: backend/test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Fail job if Go tests failed
        if: steps.run-go-tests.outcome == 'failure'
        run: exit 1

  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx vitest run --config vitest.config.ts --reporter=default --reporter=junit --outputFile=test-results.xml
        working-directory: frontend
        continue-on-error: true
        id: run-tests

      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest
          path: frontend/test-results.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Fail job if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
