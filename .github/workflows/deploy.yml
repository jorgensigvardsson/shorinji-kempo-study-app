name: Deploy

on:
  push:
    branches: [deploy]

# id-token: write  — lets the job exchange a GitHub OIDC token for an Azure access token
# packages: write  — lets the job push images to GHCR
# contents: read   — lets the job check out code
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ── 1. Build backend images and push to GHCR ────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      auth_image:        ${{ steps.build.outputs.auth_image }}
      persistence_image: ${{ steps.build.outputs.persistence_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth and persistence images
        id: build
        run: |
          set -euo pipefail
          # GHCR requires lowercase owner
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          AUTH_IMAGE="ghcr.io/${OWNER}/sk-auth:${{ github.sha }}"
          PERSISTENCE_IMAGE="ghcr.io/${OWNER}/sk-persistence:${{ github.sha }}"

          docker build -f backend/auth/Dockerfile        -t "$AUTH_IMAGE"        backend/
          docker build -f backend/persistence/Dockerfile -t "$PERSISTENCE_IMAGE" backend/
          docker push "$AUTH_IMAGE"
          docker push "$PERSISTENCE_IMAGE"

          echo "auth_image=$AUTH_IMAGE"               >> "$GITHUB_OUTPUT"
          echo "persistence_image=$PERSISTENCE_IMAGE" >> "$GITHUB_OUTPUT"

  # ── 2. Deploy backend infrastructure via Bicep; capture service URLs ─────────
  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    outputs:
      auth_url: ${{ steps.bicep.outputs.auth_url }}
      api_url:  ${{ steps.bicep.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      # Workload identity federation — no stored Azure secret
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Build a parameter override file so jq handles newlines in the PEM correctly.
      # main.parameters.json supplies namePrefix, location, cosmosDatabase, etc.
      # This overlay supplies images, OIDC credentials, and the signing key.
      - name: Build parameter overrides
        env:
          AUTH_IMAGE:               ${{ needs.build-backend.outputs.auth_image }}
          PERSISTENCE_IMAGE:        ${{ needs.build-backend.outputs.persistence_image }}
          GOOGLE_CLIENT_ID:         ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:     ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID:      ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET:  ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          SIGNING_KEY_PEM:          ${{ secrets.SIGNING_KEY_PEM }}
          FRONTEND_URL:             ${{ vars.FRONTEND_URL }}
        run: |
          jq -n \
            --arg authImage             "$AUTH_IMAGE" \
            --arg persistenceImage      "$PERSISTENCE_IMAGE" \
            --arg googleClientId        "$GOOGLE_CLIENT_ID" \
            --arg googleClientSecret    "$GOOGLE_CLIENT_SECRET" \
            --arg microsoftClientId     "$MICROSOFT_CLIENT_ID" \
            --arg microsoftClientSecret "$MICROSOFT_CLIENT_SECRET" \
            --arg signingKeyPem         "$SIGNING_KEY_PEM" \
            --arg frontendUrl           "$FRONTEND_URL" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              contentVersion: "1.0.0.0",
              parameters: {
                authImage:             {value: $authImage},
                persistenceImage:      {value: $persistenceImage},
                googleClientId:        {value: $googleClientId},
                googleClientSecret:    {value: $googleClientSecret},
                microsoftClientId:     {value: $microsoftClientId},
                microsoftClientSecret: {value: $microsoftClientSecret},
                signingKeyPem:         {value: $signingKeyPem},
                frontendUrl:           {value: $frontendUrl}
              }
            }' > /tmp/deploy-params.json

      - name: Deploy infrastructure and capture service URLs
        id: bicep
        run: |
          output=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file  infrastructure/main.bicep \
            --parameters     @infrastructure/main.parameters.json \
            --parameters     @/tmp/deploy-params.json \
            --query          properties.outputs \
            --output         json)

          echo "auth_url=$(echo "$output" | jq -r '.authServiceUrl.value')"       >> "$GITHUB_OUTPUT"
          echo "api_url=$(echo "$output" | jq -r '.persistenceServiceUrl.value')" >> "$GITHUB_OUTPUT"

      - name: Bind custom domain TLS certificates
        run: |
          # hostname add registers the hostname (idempotent); hostname bind issues/renews
          # the managed cert and switches bindingType to SniEnabled (also idempotent).
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          az containerapp hostname add \
            --hostname auth-shorinjikempo.cash-it.se \
            --resource-group "$RG" \
            --name sk-study-app-auth || true
          az containerapp hostname bind \
            --hostname auth-shorinjikempo.cash-it.se \
            --resource-group "$RG" \
            --name sk-study-app-auth \
            --environment sk-study-app-env \
            --validation-method CNAME

          az containerapp hostname add \
            --hostname persistence-shorinjikempo.cash-it.se \
            --resource-group "$RG" \
            --name sk-study-app-persistence || true
          az containerapp hostname bind \
            --hostname persistence-shorinjikempo.cash-it.se \
            --resource-group "$RG" \
            --name sk-study-app-persistence \
            --environment sk-study-app-env \
            --validation-method CNAME

  # ── 3. Build and deploy frontend with backend URLs baked in ─────────────────
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    env:
      IMAGE:    internal-docker-registry:80/shorinjikempo:latest
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env.production
        env:
          VITE_AUTH_URL:             ${{ vars.VITE_AUTH_URL }}
          VITE_API_URL:              ${{ vars.VITE_API_URL }}
          VITE_DEBUG:                ${{ vars.VITE_DEBUG || 'false' }}
          VITE_FEEDBACK_EMAIL:       ${{ secrets.VITE_FEEDBACK_EMAIL }}
          VITE_ONEDRIVE_CLIENT_ID:   ${{ secrets.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_ONEDRIVE_TENANT_ID:   ${{ vars.VITE_ONEDRIVE_TENANT_ID || 'consumers' }}
          VITE_ONEDRIVE_REDIRECT_URI: ${{ vars.VITE_ONEDRIVE_REDIRECT_URI }}
          VITE_BACKEND_ENABLED:      "true"
          VITE_GOOGLE_CLIENT_ID:     ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_REDIRECT_URI:  ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          missing=()
          require() {
            local name="$1" value="$2"
            [ -n "$value" ] || missing+=("$name")
          }
          require VITE_AUTH_URL           "$VITE_AUTH_URL"
          require VITE_API_URL            "$VITE_API_URL"
          require VITE_FEEDBACK_EMAIL     "$VITE_FEEDBACK_EMAIL"
          require VITE_ONEDRIVE_CLIENT_ID "$VITE_ONEDRIVE_CLIENT_ID"
          require VITE_ONEDRIVE_TENANT_ID "$VITE_ONEDRIVE_TENANT_ID"
          require VITE_GOOGLE_CLIENT_ID   "$VITE_GOOGLE_CLIENT_ID"
          require VITE_GOOGLE_CLIENT_SECRET "$VITE_GOOGLE_CLIENT_SECRET"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required deploy secrets/vars: ${missing[*]}"
            echo "::error::Set them in repo Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

          : > frontend/.env.production
          write_var() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> frontend/.env.production
            fi
          }
          write_var VITE_AUTH_URL              "$VITE_AUTH_URL"
          write_var VITE_API_URL               "$VITE_API_URL"
          write_var VITE_DEBUG                 "$VITE_DEBUG"
          write_var VITE_FEEDBACK_EMAIL        "$VITE_FEEDBACK_EMAIL"
          write_var VITE_ONEDRIVE_CLIENT_ID    "$VITE_ONEDRIVE_CLIENT_ID"
          write_var VITE_ONEDRIVE_TENANT_ID    "$VITE_ONEDRIVE_TENANT_ID"
          write_var VITE_ONEDRIVE_REDIRECT_URI "$VITE_ONEDRIVE_REDIRECT_URI"
          write_var VITE_BACKEND_ENABLED       "$VITE_BACKEND_ENABLED"
          write_var VITE_GOOGLE_CLIENT_ID      "$VITE_GOOGLE_CLIENT_ID"
          write_var VITE_GOOGLE_CLIENT_SECRET  "$VITE_GOOGLE_CLIENT_SECRET"
          write_var VITE_GOOGLE_REDIRECT_URI   "$VITE_GOOGLE_REDIRECT_URI"

      - name: Build image
        run: docker build -t "$IMAGE" ./frontend

      - name: Save and compress image
        run: docker save "$IMAGE" | gzip > image.tar.gz

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          DEPLOY_HOST="${SSH_HOST%:*}"
          DEPLOY_PORT="${SSH_HOST##*:}"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"

      - name: Copy image to server
        run: |
          REMOTE_PATH="/tmp/shorinjikempo-${{ github.sha }}.tar.gz"
          scp -i ~/.ssh/id_deploy -P "$DEPLOY_PORT" \
            image.tar.gz "$SSH_USER@$DEPLOY_HOST:$REMOTE_PATH"
          echo "REMOTE_PATH=$REMOTE_PATH" >> "$GITHUB_ENV"

      - name: Load, push, and restart stack on server
        run: |
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "$SSH_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          trap 'rm -f "$REMOTE_PATH"' EXIT
          gunzip < "$REMOTE_PATH" | docker load
          docker push "$IMAGE"
          cd services/shorinjikempo
          docker compose down
          docker compose up -d
          REMOTE
