name: Deploy-Staging

on:
  workflow_run:
    workflows: ["Test"]
    branches:
      - deploy-staging
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}      # format: dns-name:port
      SSH_USER: ${{ secrets.SSH_USER }}
      # Web root on the LiteSpeed host, relative to $SSH_USER's home directory.
      DEPLOY_PATH: domains/app-staging.shorinjikempo.net/public_html
      SITE_URL: https://app-staging.shorinjikempo.net
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write .env.production from secrets
        env:
          VITE_DEBUG: ${{ vars.VITE_DEBUG || 'true' }}
          VITE_FEEDBACK_EMAIL: ${{ secrets.VITE_FEEDBACK_EMAIL }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ secrets.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_ONEDRIVE_TENANT_ID: ${{ vars.VITE_ONEDRIVE_TENANT_ID || 'consumers' }}
          VITE_ONEDRIVE_REDIRECT_URI: ${{ vars.VITE_ONEDRIVE_REDIRECT_URI }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          missing=()
          require() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          }
          # VITE_DEBUG is the only value allowed to be missing (it defaults to "false").
          # VITE_ONEDRIVE_REDIRECT_URI and VITE_GOOGLE_REDIRECT_URI are optional —
          # if blank, the app falls back to "<origin>/" at runtime.
          require VITE_FEEDBACK_EMAIL "$VITE_FEEDBACK_EMAIL"
          require VITE_ONEDRIVE_CLIENT_ID "$VITE_ONEDRIVE_CLIENT_ID"
          require VITE_ONEDRIVE_TENANT_ID "$VITE_ONEDRIVE_TENANT_ID"
          require VITE_GOOGLE_CLIENT_ID "$VITE_GOOGLE_CLIENT_ID"
          require VITE_GOOGLE_CLIENT_SECRET "$VITE_GOOGLE_CLIENT_SECRET"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required deploy secrets/vars: ${missing[*]}"
            echo "::error::Set them in repo Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

          : > frontend/.env.production
          write_var() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> frontend/.env.production
            fi
          }
          write_var VITE_DEBUG "$VITE_DEBUG"
          write_var VITE_FEEDBACK_EMAIL "$VITE_FEEDBACK_EMAIL"
          write_var VITE_ONEDRIVE_CLIENT_ID "$VITE_ONEDRIVE_CLIENT_ID"
          write_var VITE_ONEDRIVE_TENANT_ID "$VITE_ONEDRIVE_TENANT_ID"
          write_var VITE_ONEDRIVE_REDIRECT_URI "$VITE_ONEDRIVE_REDIRECT_URI"
          write_var VITE_GOOGLE_CLIENT_ID "$VITE_GOOGLE_CLIENT_ID"
          write_var VITE_GOOGLE_CLIENT_SECRET "$VITE_GOOGLE_CLIENT_SECRET"
          write_var VITE_GOOGLE_REDIRECT_URI "$VITE_GOOGLE_REDIRECT_URI"

      - name: Build site
        run: |
          npm ci
          npm run build
        working-directory: frontend

      # Staging must stay out of search results. Written into dist/ after the
      # build rather than kept in frontend/public/, which would ship the same
      # Disallow to production. The .htaccess rewrite only falls through to
      # index.html for paths that do not exist on disk, so a real file here is
      # served as-is.
      - name: Disallow crawling of staging
        run: |
          printf 'User-agent: *\nDisallow: /\n' > frontend/dist/robots.txt

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          DEPLOY_HOST="${SSH_HOST%:*}"
          DEPLOY_PORT="${SSH_HOST##*:}"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"

      - name: Check remote prerequisites
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$SSH_USER@$DEPLOY_HOST" \
            "command -v rsync >/dev/null && [ -d '$DEPLOY_PATH' ]" \
            || { echo "::error::Deploy host is missing rsync, or $DEPLOY_PATH does not exist."; exit 1; }

      # Full synchronisation: new files added, changed files updated, files no
      # longer in the build removed. --delete-after keeps the old build servable
      # until every new file has landed, so the window of a half-updated site is
      # as short as rsync can make it.
      #
      # .well-known is excluded so the host's certificate renewal (and anything
      # else it drops there) survives; rsync also protects excluded paths from
      # --delete, which is exactly what we want.
      - name: Sync site to web root
        run: |
          set -euo pipefail
          rsync -rlptvz --delete-after --human-readable \
            --chmod=D755,F644 \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            -e "ssh -i ~/.ssh/id_deploy -p $DEPLOY_PORT -o IdentitiesOnly=yes" \
            frontend/dist/ "$SSH_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Verify site is serving
        run: |
          set -uo pipefail
          base="${SITE_URL%/}"
          fail=0
          # The root must serve the app shell, and a client-side route must fall
          # through to it as well — that second check is what proves the
          # .htaccess rewrite is actually in effect.
          for path in "/" "/changelog"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "${base}${path}" || echo 000)
            echo "GET ${base}${path} -> ${status}"
            [ "$status" = "200" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Post-deploy verification failed — the site is not serving as expected."
            exit 1
          fi
