services:

  frontend:
    image: node:22-alpine
    working_dir: /app
    # npm install runs on every start so the Linux-built node_modules are current.
    # node_modules is shadowed by a named volume so the Windows copy is never used.
    command: sh -c "npm install && npx vite --host"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_HTTPS: "false"          # disables mkcert; localhost is a secure context anyway
      VITE_BACKEND_ENABLED: "true" # show sign-in UI; set to "false" (or omit) for staging

  auth:
    image: golang:latest
    working_dir: /app/auth
    # Install air once into the cached go_root volume, then run it.
    command: sh -c "command -v air || go install github.com/air-verse/air@latest; air"
    volumes:
      - ./backend:/app               # whole backend/ dir so go.work and shared/ are visible
      - go_root:/root/go             # covers pkg/mod AND bin — air persisted here
      - go_build:/root/.cache/go-build
      - auth_data:/app/auth/data
    ports:
      - "8081:8081"
    environment:
      SERVICE_LISTEN_ADDRESS: ":8081"
      SERVICE_ISSUER: "http://localhost:8081"
      SERVICE_FRONTEND_URL: "http://localhost:5173"
      GOOGLE_REDIRECT_URI: "http://localhost:8081/auth/callback"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      MICROSOFT_REDIRECT_URI: "http://localhost:8081/auth/callback"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET}"
      COSMOS_ENDPOINT: "${COSMOS_ENDPOINT}"
      COSMOS_KEY: "${COSMOS_KEY}"
      RATE_LIMIT_RPS: "1"
      RATE_LIMIT_BURST: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s   # air needs time to compile on first run

  persistence:
    image: golang:latest
    working_dir: /app/persistence
    command: sh -c "command -v air || go install github.com/air-verse/air@latest; air"
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./backend:/app               # whole backend/ dir so go.work and shared/ are visible
      - go_root:/root/go             # shared with auth — air only installed once
      - go_build:/root/.cache/go-build
      - persistence_data:/app/persistence/data
    ports:
      - "8080:8080"
    environment:
      SERVICE_LISTEN_ADDRESS: ":8080"
      SERVICE_FRONTEND_URL: "http://localhost:5173"
      SERVICE_STORAGE: "cosmosdb"
      AUTH_JWKS_URL: "http://auth:8081/.well-known/jwks.json"
      COSMOS_DB_ENDPOINT: "${COSMOS_ENDPOINT}"
      COSMOS_DB_KEY: "${COSMOS_KEY}"
      COSMOS_DB_DATABASE: "shorinji"
      COSMOS_DB_CONTAINER: "documents"
      RATE_LIMIT_RPS: "2"
      RATE_LIMIT_BURST: "10"

volumes:
  frontend_modules:   # Linux-built node_modules, shadows the Windows copy
  go_root:            # shared Go root (module cache + air binary)
  go_build:           # shared Go build cache
  auth_data:          # signing key + user files
  persistence_data:   # document files
