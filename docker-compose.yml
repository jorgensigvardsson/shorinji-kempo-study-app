# The development stack: three services with the working tree mounted in, each
# watched by its own tool (Vite, air), behind one nginx reverse proxy.
#
#   docker compose up
#   https://localhost:5173
#
# Only the proxy publishes a port. It terminates TLS and routes by path —
# /auth/* to auth, /api/* and /push/* to persistence, everything else to Vite —
# so the browser talks to a single origin and the services talk to each other
# over the compose network by name. See infrastructure/dev-proxy/nginx.conf.
#
# DEV_HOST (default localhost) is the name that origin is reached by, and goes
# into the issuer, redirect and CORS/CSRF origins below. Set it in .env to
# nuc-dev or 192.168.0.6 to drive the stack from a phone on the LAN; the
# committed certificate covers all three.

services:

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - auth
      - persistence
    volumes:
      - ./infrastructure/dev-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./localhost.pem:/etc/nginx/tls/localhost.pem:ro
      - ./localhost.key:/etc/nginx/tls/localhost.key:ro
    ports:
      - "5173:5173"

  frontend:
    image: node:22-alpine
    working_dir: /app
    # npm install runs on every start so the Linux-built node_modules are current.
    # node_modules is shadowed by a named volume so the Windows copy is never used.
    command: sh -c "npm install && npx vite --host"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_HTTPS: "false"          # nginx terminates TLS; Vite serves plain HTTP behind it
      # Read by vite.config.ts: tells the HMR client to use wss on the published
      # port, and adds the proxy's hostname to Vite's allowed-hosts check.
      VITE_TLS_PROXY: "${DEV_HOST:-localhost}"
      # Empty on purpose. Both are prefixes the app puts in front of its API
      # paths, so empty means "same origin as the page" — which is now true of
      # every service, and stays true whichever of the certificate's three names
      # the browser arrived by.
      VITE_API_URL: ""
      VITE_AUTH_URL: ""

  auth:
    image: golang:latest
    working_dir: /app/auth
    # Install air once into the cached go_root volume, then run it.
    command: sh -c "command -v air || go install github.com/air-verse/air@latest; air"
    volumes:
      - ./backend:/app               # whole backend/ dir so go.work and shared/ are visible
      - go_root:/root/go             # covers pkg/mod AND bin — air persisted here
      - go_build:/root/.cache/go-build
      - ./devdata/auth:/app/auth/data
    environment:
      SERVICE_LISTEN_ADDRESS: ":8081"
      # The public origin, not this container's address: the issuer goes into
      # every token's iss claim (persistence checks it), and the redirect URIs
      # are where the browser is sent back to — through the proxy, which routes
      # /auth/callback here.
      SERVICE_ISSUER: "https://${DEV_HOST:-localhost}:5173"
      SERVICE_FRONTEND_URL: "https://${DEV_HOST:-localhost}:5173"
      GOOGLE_REDIRECT_URI: "https://${DEV_HOST:-localhost}:5173/auth/callback"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      MICROSOFT_REDIRECT_URI: "https://${DEV_HOST:-localhost}:5173/auth/callback"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET}"
      # No domain is routed to an OIDC provider locally, so every address —
      # gmail.com included — signs in with an emailed code, which LogSender
      # prints to this service's stdout. That is what makes the account seeded
      # by cmd/devseed reachable at all: an OIDC "sub" is minted by the
      # provider, so a seeded account can never carry the right one, and a
      # gmail.com address routed to Google would be treated as a stranger.
      # Set these to the production defaults to exercise the OIDC redirect.
      GOOGLE_DOMAINS: ""
      MICROSOFT_DOMAINS: ""
      COSMOS_ENDPOINT: "${COSMOS_ENDPOINT}"
      COSMOS_KEY: "${COSMOS_KEY}"
      # Looser than production: React re-runs effects in development, so pages
      # fetch twice and the production budget trips on an ordinary page load.
      RATE_LIMIT_RPS: "20"
      RATE_LIMIT_BURST: "60"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s   # air needs time to compile on first run

  persistence:
    image: golang:latest
    working_dir: /app/persistence
    command: sh -c "command -v air || go install github.com/air-verse/air@latest; air"
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./backend:/app               # whole backend/ dir so go.work and shared/ are visible
      - go_root:/root/go             # shared with auth — air only installed once
      - go_build:/root/.cache/go-build
      - ./devdata/persistence:/app/persistence/data
    environment:
      SERVICE_LISTEN_ADDRESS: ":8080"
      SERVICE_FRONTEND_URL: "https://${DEV_HOST:-localhost}:5173"
      SERVICE_STORAGE: "file"
      # Keys are fetched container-to-container, so this one stays internal and
      # plain HTTP — it never goes near the browser or the proxy's certificate.
      AUTH_JWKS_URL: "http://auth:8081/.well-known/jwks.json"
      # Must match auth's SERVICE_ISSUER above — this is the issuer claim
      # checked on every token.
      AUTH_ISSUER_URL: "https://${DEV_HOST:-localhost}:5173"
      COSMOS_DB_ENDPOINT: "${COSMOS_ENDPOINT}"
      COSMOS_DB_KEY: "${COSMOS_KEY}"
      COSMOS_DB_DATABASE: "shorinji"
      COSMOS_DB_CONTAINER: "documents"
      RATE_LIMIT_RPS: "2"
      RATE_LIMIT_BURST: "10"
      # Web Push — dev-only VAPID key pair.
      # Generate your own with `npx web-push generate-vapid-keys`. Never reuse these in production.
      VAPID_PUBLIC_KEY:  "BMFC5ak6g3tvewUomeT9j-88XsBs0H8rS-0jIOi5JWg2QK_ZOan24AyRro7USk33XsqgUKYq_4vqt9dJ5TYXBTw"
      VAPID_PRIVATE_KEY: "DsidlmkQ3_MmHM9RsbpNp2TqP8Seh-aD4Otm4dTZxZQ"
      VAPID_SUBJECT:     "mailto:jorgen.sigvardsson@gmail.com"
      PUSH_ADMIN_TOKEN:  "dev-broadcast-token"

volumes:
  frontend_modules:   # Linux-built node_modules, shadows the Windows copy
  go_root:            # shared Go root (module cache + air binary)
  go_build:           # shared Go build cache
  # Signing key, user files and documents live under ./devdata on the host (see
  # .gitignore) rather than in named volumes, so they can be inspected, backed
  # up, or wiped with `backend/auth/cmd/devseed` without going through Docker.
