<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- Browsers that understand SVG icons take this one and scale it to whatever
         size the tab, bookmark bar or task switcher wants; the PNGs below remain
         the fallback for those that do not (notably Safari). -->
    <link rel="icon" type="image/svg+xml" href="/shorinjikempo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&amp;family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&amp;family=Shippori+Mincho:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shorinji Kempo Study App</title>
    <script>
      let pref = "system";
      try {
        const documentJson = localStorage.getItem("app-data-document");
        const storedTheme = documentJson ? JSON.parse(documentJson)?.data?.theme : undefined;
        if (["light", "dark", "system"].includes(storedTheme)) {
          pref = storedTheme;
        } else {
          // Compatibility with theme choices saved before settings moved into
          // the shared app-data document.
          pref = localStorage.getItem("theme-preference") || "system";
        }
      } catch {
        // A missing or malformed local document should never block startup.
      }
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = pref === "system" ? (systemDark ? "dark" : "light") : pref;
      document.documentElement.setAttribute("data-bs-theme", theme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
