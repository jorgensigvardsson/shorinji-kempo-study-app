# The development stack's single front door. nginx terminates TLS on 5173 and
# hands each request to whichever service owns that path, so the browser only
# ever sees one origin — https://localhost:5173 — and the three containers
# behind it keep speaking plain HTTP among themselves.
#
# One origin is the point of the exercise: no CORS preflight on every call, one
# certificate warning instead of three, and cookies that are simply the
# origin's cookies. It does mean development no longer exercises the
# cross-origin path the deployed app takes — production gives each service its
# own hostname — so the CORS middleware is covered by its own tests and by
# staging rather than by running this stack.
#
# This file is mounted over /etc/nginx/conf.d/default.conf, so the image's own
# nginx.conf still supplies mime types, logging to stdout, and the rest.

# Docker's embedded DNS server. Resolving upstreams here, at request time,
# rather than once at startup, is what lets `docker compose restart frontend`
# work: nginx picks up the container's new address on the next request instead
# of holding the old one until it is restarted itself, and it starts fine even
# when a service behind it is still building.
resolver 127.0.0.11 valid=10s ipv6=off;

# Passed through to the upstream unchanged on a websocket handshake ("upgrade")
# and empty otherwise, which is what a proxy must send on an ordinary request.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# Access logging, filtered to the requests worth reading. Vite serves one module
# per source file, so an ordinary page load is several hundred 200s and 304s —
# enough to bury the backends' own output in `docker compose logs`. Anything
# that did not succeed still gets a line.
#
# To see every request again, drop the `if=` below (or set the default to 1).
map $status $is_failure {
	~^[123]  0;   # 1xx websocket upgrades, 2xx, and 3xx — including Vite's 304s
	499      0;   # client went away: a reload closing the HMR socket, or Vite
	              # cancelling module requests mid-flight. Routine here.
	default  1;   # 4xx and 5xx
}

# Compact on purpose: when a line does appear, what matters is which service the
# request reached and how long it spent there, not the user agent.
log_format dev '$status $request_method $request_uri '
               '-> ${upstream_addr} ${request_time}s';

server {
	listen 5173 ssl;
	listen [::]:5173 ssl;
	http2 on;   # Vite serves a module per source file; one connection, not six

	# Self-signed, committed to the repo, ten-year lifetime. See
	# infrastructure/scripts/gen-dev-cert.sh for why that is not a mistake.
	ssl_certificate     /etc/nginx/tls/localhost.pem;
	ssl_certificate_key /etc/nginx/tls/localhost.key;

	access_log /var/log/nginx/access.log dev if=$is_failure;   # → stdout
	# error_log is untouched: upstream failures (a service still compiling, a
	# dropped connection) are reported there regardless of status filtering.

	# The persistence service caps document writes itself (1 MB, see its
	# MaxBytesReader); this only has to stay clear of that cap so its error
	# reaches the client instead of nginx's.
	client_max_body_size 8m;

	# Deliberately no gzip. nginx marks a response it compressed itself with a
	# weak ETag, and a weak ETag cannot be used in the If-Match precondition the
	# document sync sends on every write.

	# Shared by every location below. proxy_pass with a variable skips nginx's
	# URI normalization, so $request_uri is appended verbatim — no path is
	# rewritten anywhere in this file; each service sees exactly what the
	# browser asked for.
	proxy_http_version 1.1;
	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-Host  $host;
	proxy_set_header Upgrade           $http_upgrade;
	proxy_set_header Connection        $connection_upgrade;

	# The backends set HSTS on every response (see backend/shared/secureheaders),
	# which is right in production and harmful here: HSTS is scoped to a host and
	# ignores the port, so one visit to this stack would pin *every* localhost
	# port on the machine to https for a year — including plain-HTTP dev servers
	# belonging to other projects. Browsers ignore the header over plain HTTP,
	# which is why it was harmless before there was a TLS proxy in front.
	proxy_hide_header Strict-Transport-Security;

	# Both backends scale to zero in production and are compiled on demand by
	# air here, so the first request after a code change waits on a build.
	proxy_connect_timeout 10s;
	proxy_read_timeout    120s;

	# --- auth service -------------------------------------------------------
	# Everything it registers except /healthz, which both backends serve and
	# neither needs to expose to the browser. See its Register() for the list.
	location /auth/ {
		set $auth http://auth:8081;
		proxy_pass $auth$request_uri;
	}

	location = /.well-known/jwks.json {
		set $auth http://auth:8081;
		proxy_pass $auth$request_uri;
	}

	# --- persistence service ------------------------------------------------
	location /api/ {
		set $persistence http://persistence:8080;
		proxy_pass $persistence$request_uri;
	}

	location /push/ {
		set $persistence http://persistence:8080;
		proxy_pass $persistence$request_uri;
	}

	# --- the app ------------------------------------------------------------
	# Everything else is Vite's: the app itself, its source modules, and the
	# /@vite/client websocket carrying hot updates. That socket is idle between
	# edits, so it needs a read timeout long enough to outlive a lunch break —
	# otherwise nginx closes it and the page reconnects (or stops updating).
	location / {
		set $frontend http://frontend:5173;
		proxy_pass $frontend$request_uri;
		proxy_read_timeout 7d;
		proxy_buffering off;   # hot updates should not wait for a full buffer
	}
}
