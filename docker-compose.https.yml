# HTTPS overlay for local development. Bring it up alongside the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up
#
# A single Caddy container terminates TLS on the same three ports the base file
# publishes (5173, 8081, 8080), using a self-signed cert that covers localhost,
# nuc-dev and 192.168.0.6. Generate the cert once:
#
#   infrastructure/scripts/gen-dev-cert.sh
#
# The app services keep speaking plain HTTP among themselves; only the URLs the
# browser is handed switch to https. DEV_HOST (default localhost) picks which
# name those URLs use — set it to nuc-dev or 192.168.0.6 in .env to drive the
# stack from another device on the LAN. The cert covers all three regardless.

services:

  proxy:
    image: caddy:2-alpine
    depends_on:
      - frontend
      - auth
      - persistence
    volumes:
      - ./infrastructure/dev-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/dev-tls/certs:/etc/caddy/certs:ro
    ports:
      - "5173:5173"
      - "8081:8081"
      - "8080:8080"

  frontend:
    # Caddy owns the published port now; Vite listens only on the compose network.
    ports: !reset []
    environment:
      # Read by vite.config.ts to fix up HMR-over-wss and the dev-server host
      # check while it runs behind the proxy.
      VITE_TLS_PROXY: "${DEV_HOST:-localhost}"
      VITE_API_URL: "https://${DEV_HOST:-localhost}:8080"
      VITE_AUTH_URL: "https://${DEV_HOST:-localhost}:8081"

  auth:
    ports: !reset []
    environment:
      SERVICE_ISSUER: "https://${DEV_HOST:-localhost}:8081"
      SERVICE_FRONTEND_URL: "https://${DEV_HOST:-localhost}:5173"
      GOOGLE_REDIRECT_URI: "https://${DEV_HOST:-localhost}:8081/auth/callback"
      MICROSOFT_REDIRECT_URI: "https://${DEV_HOST:-localhost}:8081/auth/callback"

  persistence:
    ports: !reset []
    environment:
      SERVICE_FRONTEND_URL: "https://${DEV_HOST:-localhost}:5173"
      # Must match auth's SERVICE_ISSUER above — this is the issuer claim the
      # persistence service checks on every token. JWKS is still fetched over
      # the internal network (AUTH_JWKS_URL in the base file), not through Caddy.
      AUTH_ISSUER_URL: "https://${DEV_HOST:-localhost}:8081"
